name: Release CI

on:
  push:
    branches: [ main ]

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Install Ubuntu Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build and Package Desktop App
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: 'v1.0.${{ github.run_number }}'
          tagMessage: 'Automated Build v1.0.${{ github.run_number }}'
          releaseName: 'Bibiliya Yera v1.0.${{ github.run_number }}'
          releaseBody: 'Automated installers compiled cleanly by GitHub Actions.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}