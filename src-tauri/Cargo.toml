[package]
name = "bibiliya-yera"
version = "1.0.0"
description = "Bibiliya Yera — Kinyarwanda Bible, offline-first"
authors = ["Bibiliya Yera"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "bibiliya_yera_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memchr = "2"
ureq = { version = "2", features = ["tls", "json"] }
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
